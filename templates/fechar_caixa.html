{% extends "base.html" %}
{% block conteudo %}

<style>
.container { max-width:600px; margin:20px auto; padding:20px }
.card { background:var(--card-bg); padding:18px; border-radius:10px;
  box-shadow:var(--shadow); border:1px solid var(--border); }
h2 { text-align:center; color:var(--accent); margin-bottom:10px; }
label { font-weight:bold; color:var(--accent); }
input { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
  margin-top:6px; background:var(--input-bg); color:var(--text); }
.btn { background:var(--btn-bg); color:var(--accent); border:none;
  padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:bold; }
.btn:hover { background:var(--accent-hover); }
.btn-sec { background:var(--card-bg); color:var(--accent); border:1px solid var(--border); }
.btn-sec:hover { background:var(--accent-dim); }
.erro { background:#2a0f0f; border:1px solid #5a1f1f; color:#f87171;
  padding:10px; border-radius:8px; margin-bottom:10px; }
.linha { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.obs { font-size:12px; color:var(--text-muted); margin-top:8px; text-align:center; }
</style>

<div class="container">
  <h2>Fechar Caixa</h2>

  <div class="card">
    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}

    <!-- ✅ agora vai para a PRÉVIA antes de confirmar -->
    <form method="post" action="/fechar_caixa/previa">
      <label>Escolha o dia do caixa</label>
      <input type="date" name="dia" value="{{ hoje }}" required>

      <div class="obs">
        Você verá uma <b>prévia</b> do caixa antes de confirmar o fechamento.
      </div>

      <div class="linha">
        <button class="btn" type="submit">Ver Prévia</button>

        <a class="btn btn-sec" href="/caixa" style="text-decoration:none;">
          Histórico de Caixas
        </a>

        <a class="btn btn-sec" href="/vendas" style="text-decoration:none;">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
