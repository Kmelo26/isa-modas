{% extends "base.html" %}
{% block conteudo %}

<style>
.container { max-width:600px; margin:20px auto; padding:20px }
.card{
  background:white; padding:18px; border-radius:10px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
}
h2{ text-align:center; color:#ff1493; margin-bottom:10px; }
label{ font-weight:bold; color:#ff1493; }
input{
  width:100%;
  padding:10px;
  border:1px solid #ffb6c1;
  border-radius:8px;
  margin-top:6px;
}
.btn{
  background:#ff69b4; color:white; border:none;
  padding:10px 14px; border-radius:8px; cursor:pointer;
  font-weight:bold;
}
.btn:hover{ opacity:0.9; }
.btn-sec{
  background:#fff; color:#ff1493; border:1px solid #ffb6c1;
}
.erro{
  background:#ffe6e6; border:1px solid #ff9aa9; color:#b00020;
  padding:10px; border-radius:8px; margin-bottom:10px;
}
.linha{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.obs{ font-size:12px; color:#666; margin-top:8px; text-align:center; }
</style>

<div class="container">
  <h2>Fechar Caixa</h2>

  <div class="card">
    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}

    <!-- ✅ agora vai para a PRÉVIA antes de confirmar -->
    <form method="post" action="/fechar_caixa/previa">
      <label>Escolha o dia do caixa</label>
      <input type="date" name="dia" value="{{ hoje }}" required>

      <div class="obs">
        Você verá uma <b>prévia</b> do caixa antes de confirmar o fechamento.
      </div>

      <div class="linha">
        <button class="btn" type="submit">Ver Prévia</button>

        <a class="btn btn-sec" href="/caixa" style="text-decoration:none;">
          Histórico de Caixas
        </a>

        <a class="btn btn-sec" href="/vendas" style="text-decoration:none;">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
