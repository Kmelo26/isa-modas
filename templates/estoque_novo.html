{% extends "base.html" %}
{% block conteudo %}

<style>
.container { max-width:700px; margin:20px auto; padding:20px }
h2 { text-align:center; color:var(--accent); }
form { background:var(--card-bg); padding:15px; border-radius:10px;
  box-shadow:var(--shadow); border:1px solid var(--border);
  margin-bottom:15px; display:flex; flex-direction:column; gap:10px; }
form input, form button { padding:10px; border-radius:8px;
  border:1px solid var(--border); width:100%; background:var(--input-bg); color:var(--text); }
form button { background:var(--btn-bg); color:var(--accent); border:none; cursor:pointer; font-weight:bold; }
form button:hover { background:var(--accent-hover); }
.alerta { color:#f87171; font-weight:bold; background:#2a0f0f;
  border:1px solid #5a1f1f; padding:10px; border-radius:8px; margin-bottom:10px; }
.btn-voltar { display:inline-block; padding:8px 12px; border-radius:8px; text-decoration:none;
  font-weight:bold; border:1px solid var(--border); color:var(--accent); background:var(--card-bg); }
.btn-voltar:hover { background:var(--accent-dim); }
</style>

<div class="container">
  <h2>Cadastrar Produto no Estoque</h2>

  {% if erro %}
    <div class="alerta">{{ erro }}</div>
  {% endif %}

  <form method="POST">
      <input type="date" name="data" required>
      <input type="text" name="nome" placeholder="Nome do produto" required>
      <input type="number" step="0.01" name="valor_investido" placeholder="Custo unitário (compra)" required>
      <input type="number" step="0.01" name="valor_venda" placeholder="Valor de venda" required>
      <input type="number" name="quantidade" placeholder="Quantidade" required>
      <button type="submit">Cadastrar Produto</button>
  </form>

  <a class="btn-voltar" href="{{ url_for('estoque') }}">← Voltar para o estoque</a>
</div>

{% endblock %}
