{% extends "base.html" %}
{% block conteudo %}

<style>
.container { max-width:700px; margin:20px auto; padding:20px }
.box { background:white; padding:18px; border-radius:10px; box-shadow:0 3px 8px rgba(0,0,0,0.08) }
h2 { color:#ff1493; margin:0 0 10px; text-align:center }
label { font-weight:bold; color:#ff1493; display:block; margin-top:10px }
input { width:100%; padding:10px; border:1px solid #ffb6c1; border-radius:8px; margin-top:6px }
.alerta { color:#b00020; font-weight:bold; background:#ffe6e6; border:1px solid #ff9aa9; padding:10px; border-radius:8px; margin-bottom:10px; }
.btn { margin-top:14px; display:inline-block; padding:10px 14px; border-radius:8px; text-decoration:none; font-weight:bold; border:1px solid #ff69b4; color:#ff1493; background:white; cursor:pointer }
.btn:hover{ opacity:0.9 }
</style>

<div class="container">
  <div class="box">
    <h2>Editar Produto</h2>

    {% if erro %}
      <div class="alerta">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <label>Nome</label>
      <input type="text" name="nome" value="{{ produto.get('nome','') }}" required>

      <label>Data</label>
      <input type="text" name="data" value="{{ produto.get('data','') }}" placeholder="2026-02-09">

      <label>Preço de venda</label>
      <input type="number" step="0.01" name="valor_venda" value="{{ produto.get('valor_venda',0) }}" required>

      <button class="btn" type="submit">Salvar</button>
      <a class="btn" href="{{ url_for('estoque_produto', pid=produto.get('pid')) }}">Cancelar</a>
    </form>
  </div>
</div>

{% endblock %}
