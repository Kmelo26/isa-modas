<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Faturados em Aberto</title>
<style>
body { font-family:Arial; background:#141414; color:#b8b8b8; padding:20px; }
h2 { color:#e0e0e0; }
table { border-collapse:collapse; width:100%; background:#1c1c1c; }
th, td { border:1px solid #303030; padding:8px; color:#b8b8b8; }
th { background:#222222; color:#e0e0e0; }
tr:nth-child(even) { background:#202020; }
</style>
</head>
<body>

<h2>Faturados em Aberto</h2>

<table border="1">
<tr>
<th>Data</th>
<th>Produto</th>
<th>Código</th>
<th>Quantidade</th>
<th>Valor</th>
<th>Vencimento</th>
</tr>

{% for v in faturados %}
<tr>
<td>{{ v.data }}</td>
<td>{{ v.nome }}</td>
<td>{{ v.codigo }}</td>
<td>{{ v.quantidade }}</td>
<td>R$ {{ "%.2f"|format(v.valor_venda * v.quantidade) }}</td>
<td>{{ v.vencimento }}</td>
</tr>
{% endfor %}
</table>

<p><strong>Total em aberto:</strong>
R$ {{ "%.2f"|format(total_aberto) }}</p>

</body>
</html>
